<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de una pantalla — cabecera compacta, barra de filtros, lienzo del diagrama a la izquierda y panel de detalle a la derecha (hoja inferior en teléfono). */
:root {
  --bg: #eef1f5; --surface: #ffffff; --surface-2: #f6f8fb; --ink: #17202c; --muted: #5a6677; --line: #d3d9e2;
  --edge: #8a96a8; --hi: #12223d; --hi-tint: rgba(18, 34, 61, .09); --dot: #cdd4de; --focus: #2b5fd9;
  --mod-0: #2f6db3; --mod-1: #0d857a; --mod-2: #a86d12; --mod-3: #7449b0; --mod-4: #46852a; --mod-5: #bf4f28;
  --mod-6: #b03f74; --mod-7: #7a6748; --mod-8: #1f7f9e; --mod-9: #8a7a12; --mod-10: #9c3b3b; --mod-11: #5c6878;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-code: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131a; --surface: #161d27; --surface-2: #1b2430; --ink: #e2e8f0; --muted: #94a1b3; --line: #2a3544;
    --edge: #66748a; --hi: #f1f5fb; --hi-tint: rgba(241, 245, 251, .10); --dot: #212b38; --focus: #7aa5ff;
    --mod-0: #78a6e4; --mod-1: #48c2b3; --mod-2: #e2ad57; --mod-3: #b293e6; --mod-4: #8bc862; --mod-5: #ee8a64;
    --mod-6: #e286b2; --mod-7: #c2ae89; --mod-8: #5cc0e0; --mod-9: #d4c25a; --mod-10: #e38d8d; --mod-11: #a2adbb;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e131a; --surface: #161d27; --surface-2: #1b2430; --ink: #e2e8f0; --muted: #94a1b3; --line: #2a3544;
  --edge: #66748a; --hi: #f1f5fb; --hi-tint: rgba(241, 245, 251, .10); --dot: #212b38; --focus: #7aa5ff;
  --mod-0: #78a6e4; --mod-1: #48c2b3; --mod-2: #e2ad57; --mod-3: #b293e6; --mod-4: #8bc862; --mod-5: #ee8a64;
  --mod-6: #e286b2; --mod-7: #c2ae89; --mod-8: #5cc0e0; --mod-9: #d4c25a; --mod-10: #e38d8d; --mod-11: #a2adbb;
  color-scheme: dark;
}

[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14px; overflow: hidden; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.app {
  height: 100%; display: flex; flex-direction: column; gap: 10px; box-sizing: border-box;
  padding-block: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 18px; }
.top h1 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -.01em; text-wrap: balance; }
.stats { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); font-weight: 600; }

.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.search { position: relative; flex: 0 1 300px; min-width: 0; }
.search input {
  width: 100%; box-sizing: border-box; height: 34px; padding: 0 10px 0 32px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
  font-family: var(--font-code); font-size: 12.5px;
}
.search svg { position: absolute; left: 10px; top: 10px; width: 14px; height: 14px; stroke: var(--muted); fill: none; stroke-width: 2; }
.chips { display: flex; gap: 6px; overflow-x: auto; min-width: 0; flex: 1 1 420px; padding-block: 2px; scrollbar-width: thin; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px;
  border: 1px solid var(--line); border-radius: 15px; background: var(--surface); cursor: pointer; font-size: 12.5px; white-space: nowrap;
}
.chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--mc, var(--muted)); }
.chip .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--hi); color: var(--surface); border-color: var(--hi); }
.chip[aria-pressed="true"] .n { color: inherit; opacity: .75; }
.opts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { padding: 6px 11px; font-size: 12.5px; cursor: pointer; }
.seg input:checked + label { background: var(--hi); color: var(--surface); }
.seg input:focus-visible + label { outline: 2px solid var(--focus); outline-offset: -2px; }
.toggle { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; cursor: pointer; user-select: none; }
.toggle input { width: 15px; height: 15px; accent-color: var(--hi); margin: 0; }
.toggle .n { color: var(--muted); }
.panel-btn { display: none; height: 30px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; font-size: 12.5px; }

.work { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 12px; }
.canvas {
  position: relative; min-width: 0; min-height: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 10px;
  background-color: var(--bg); background-image: radial-gradient(var(--dot) 1px, transparent 1.2px); background-size: 18px 18px;
  touch-action: none; cursor: grab;
}
.canvas.dragging { cursor: grabbing; }
.canvas svg { display: block; width: 100%; height: 100%; user-select: none; }
.zoom { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
.zoom button {
  width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
  cursor: pointer; font-size: 16px; line-height: 1; display: grid; place-items: center;
}
.zoom button.fit { font-size: 11px; font-weight: 600; }
.zoom-level { position: absolute; left: 12px; bottom: 12px; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 3px 7px; }
.busy { position: absolute; inset: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--bg) 70%, transparent); font-size: 13px; color: var(--muted); }

/* SVG */
.module-box { fill: color-mix(in srgb, var(--mc) 6%, transparent); stroke: color-mix(in srgb, var(--mc) 55%, transparent); stroke-width: 1.2; }
.module.ghost .module-box { fill: transparent; stroke-dasharray: 6 5; }
.module-label { font: 600 var(--ml, 12px) var(--font-ui); letter-spacing: .08em; text-transform: uppercase; fill: var(--mc); paint-order: stroke; stroke: var(--bg); stroke-width: calc(var(--ml, 12px) / 4); }
.tbl { cursor: pointer; }
.tbl-box { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
.tbl-stripe { fill: var(--mc); }
.tbl-title { font: 600 12.5px var(--font-ui); fill: var(--ink); }
.tbl-sep { stroke: var(--line); stroke-width: 1; }
.col-name { font: 400 12px var(--font-code); fill: var(--ink); }
.col-type { font: 400 11px var(--font-code); fill: var(--muted); }
.badge { font: 600 9.5px var(--font-code); letter-spacing: .02em; }
.badge.pk { fill: var(--ink); }
.badge.fk, .badge.uq { fill: var(--muted); }
.badge.hub { fill: var(--muted); opacity: .6; }
.col-more { font: italic 400 11px var(--font-ui); fill: var(--muted); }
.row-hl { fill: transparent; }
.row-hl.on { fill: var(--hi-tint); }
.tbl.ghost { opacity: .62; }
.tbl.ghost .tbl-box { stroke-dasharray: 5 4; }
.tbl.sel .tbl-box { stroke: var(--hi); stroke-width: 2.2; }
.edge-line { fill: none; stroke: var(--edge); stroke-width: 1.3; marker-start: url(#one); marker-end: url(#many); }
.edge-hit { fill: none; stroke: transparent; stroke-width: 11; pointer-events: stroke; cursor: help; }
.edge.hi .edge-line { stroke: var(--hi); stroke-width: 2; marker-start: url(#one-hi); marker-end: url(#many-hi); }
.edge:hover .edge-line { stroke: var(--hi); }
.mk { fill: none; stroke: var(--edge); stroke-width: 1.3; }
.mk-hi { fill: none; stroke: var(--hi); stroke-width: 1.6; }
#world.has-sel .tbl:not(.sel):not(.nb) { opacity: .25; }
#world.has-sel .edge:not(.hi) { opacity: .1; }
#world.has-sel .module { opacity: .6; }

/* Panel */
.panel { min-width: 0; min-height: 0; overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px 20px; box-sizing: border-box; }
.panel h2 { margin: 0 0 6px; font: 600 15px var(--font-code); word-break: break-all; }
.panel h3 { margin: 18px 0 8px; font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.panel p { margin: 0 0 8px; line-height: 1.5; }
.panel .lead { color: var(--muted); font-size: 13px; }
.close { float: right; border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 12.5px; padding: 2px 0 2px 8px; }
.mod-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--mc); margin-bottom: 6px; }
.mod-tag::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--mc); }
.meta { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cols { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.cols li { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 2px 8px; padding: 7px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.cols .b { font: 600 10px var(--font-code); color: var(--muted); }
.cols .b.pk { color: var(--ink); }
.cols .nm { font: 500 12px var(--font-code); word-break: break-all; }
.cols .ty { font: 400 11px var(--font-code); color: var(--muted); white-space: nowrap; }
.cols .cm { grid-column: 2 / 4; font-size: 12px; color: var(--muted); line-height: 1.45; }
.cols .nn { font: 600 9.5px var(--font-ui); letter-spacing: .05em; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-left: 6px; }
.links { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.links button { width: 100%; text-align: left; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); padding: 7px 10px; cursor: pointer; display: grid; gap: 2px; }
.links button:hover { border-color: var(--hi); }
.links .t { font: 600 12px var(--font-code); word-break: break-all; }
.links .s { font: 400 11px var(--font-code); color: var(--muted); word-break: break-all; }
.links .off { font: 500 10.5px var(--font-ui); color: var(--muted); }
.legend { display: grid; gap: 9px; font-size: 12.5px; }
.legend div { display: grid; grid-template-columns: 46px 1fr; align-items: center; gap: 10px; }
.legend svg { width: 46px; height: 18px; overflow: visible; }
.mods { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.mods button { width: 100%; display: grid; grid-template-columns: 12px 1fr auto; gap: 10px; align-items: center; padding: 6px 4px; border: 0; background: none; cursor: pointer; text-align: left; border-radius: 6px; font-size: 13px; }
.mods button:hover { background: var(--surface-2); }
.mods .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--mc); }
.mods .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.plain { margin: 0; padding-left: 18px; font: 400 12px var(--font-code); color: var(--muted); line-height: 1.7; }
.copy { border: 1px solid var(--line); background: var(--surface-2); border-radius: 6px; padding: 3px 9px; font-size: 12px; cursor: pointer; }
.err { padding: 24px; max-width: 46ch; line-height: 1.5; }

@media (max-width: 860px) {
  .work { grid-template-columns: minmax(0, 1fr); }
  .panel-btn { display: inline-block; }
  .panel {
    position: fixed; left: 0; right: 0; bottom: 0; max-height: 58%; z-index: 20; border-radius: 14px 14px 0 0;
    padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
    padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    box-shadow: 0 -8px 30px rgba(0, 0, 0, .18); transform: translateY(105%); transition: transform .2s ease;
  }
  .panel.open { transform: none; }
  .top h1 { font-size: 16px; }
  .search { flex-basis: 100%; }
  .zoom { right: calc(12px + env(safe-area-inset-right, 0px)); }
}
@media (prefers-reduced-motion: reduce) { .panel { transition: none; } }
</style>

<div class="app">
  <header class="top">
    <h1>__TITLE__</h1>
    <div class="stats" id="stats"></div>
  </header>

  <div class="toolbar">
    <label class="search" for="q">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
      <input id="q" type="search" list="tables" placeholder="Buscar tabla" autocomplete="off" aria-label="Buscar tabla">
      <datalist id="tables"></datalist>
    </label>
    <div class="chips" id="chips" role="group" aria-label="Filtrar por módulo"></div>
    <div class="opts">
      <div class="seg" role="radiogroup" aria-label="Columnas visibles">
        <input type="radio" name="mode" id="mode-keys" value="keys" checked><label for="mode-keys">Solo llaves</label>
        <input type="radio" name="mode" id="mode-all" value="all"><label for="mode-all">Todas las columnas</label>
      </div>
      <label class="toggle" for="hubs" id="hubs-wrap"><input type="checkbox" id="hubs"> <span id="hubs-label">FK a catálogos comunes</span> <span class="n" id="hubs-n"></span></label>
      <button class="panel-btn" id="panel-btn" type="button">Leyenda y detalle</button>
    </div>
  </div>

  <main class="work">
    <section class="canvas" id="canvas" aria-label="Diagrama entidad-relación">
      <svg id="svg" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="many" viewBox="0 0 14 14" refX="14" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
            <path class="mk" d="M0 7 L14 1 M0 7 L14 7 M0 7 L14 13 M2 2 V12"></path>
          </marker>
          <marker id="one" viewBox="0 0 14 14" refX="14" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
            <path class="mk" d="M5 2 V12 M9 2 V12"></path>
          </marker>
          <marker id="many-hi" viewBox="0 0 14 14" refX="14" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
            <path class="mk-hi" d="M0 7 L14 1 M0 7 L14 7 M0 7 L14 13 M2 2 V12"></path>
          </marker>
          <marker id="one-hi" viewBox="0 0 14 14" refX="14" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
            <path class="mk-hi" d="M5 2 V12 M9 2 V12"></path>
          </marker>
        </defs>
        <g id="world"></g>
      </svg>
      <div class="zoom">
        <button type="button" id="zin" aria-label="Acercar">+</button>
        <button type="button" id="zout" aria-label="Alejar">−</button>
        <button type="button" id="zfit" class="fit" aria-label="Ajustar a la pantalla">Ajustar</button>
      </div>
      <div class="zoom-level" id="zlevel">100%</div>
      <div class="busy" id="busy">Acomodando tablas…</div>
    </section>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </main>
</div>

<script>/*NGS:CORE*/</script>
<script>
const DATA = /*NGS:DATA*/;
(function () {
  'use strict';
  const C = window.ErCore, G = C.G;
  const $ = id => document.getElementById(id);
  const svg = $('svg'), world = $('world'), canvas = $('canvas'), panel = $('panel'), busy = $('busy');
  const byName = new Map(DATA.tables.map(t => [t.n, t]));
  const MOD = Object.fromEntries(DATA.modules.map(m => [m.id, m]));
  const HUBS = new Set(DATA.hubs);
  const modColor = id => `var(--mod-${MOD[id].color})`;
  const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
  const fmtDate = iso => iso.split('-').reverse().join('/');

  const state = { mode: 'keys', hubs: false, focus: null, sel: null, view: { k: 1, x: 0, y: 0 }, layout: null, pairs: null, shown: null, ghost: null };
  const hubFks = DATA.fks.filter(f => HUBS.has(f.pa));

  /* ---------- medición de texto (con las fuentes ya cargadas) ---------- */
  const ctx = document.createElement('canvas').getContext('2d');
  const FONTS = {
    title: '600 12.5px "IBM Plex Sans", system-ui, sans-serif',
    col: '400 12px "IBM Plex Mono", ui-monospace, monospace',
    type: '400 11px "IBM Plex Mono", ui-monospace, monospace',
  };
  const mcache = new Map();
  function measure(s, kind) {
    const key = kind + '|' + s;
    let w = mcache.get(key);
    if (w === undefined) { ctx.font = FONTS[kind]; w = ctx.measureText(s).width; mcache.set(key, w); }
    return w;
  }

  /* ---------- cabecera y filtros ---------- */
  const nCols = DATA.tables.reduce((a, t) => a + t.cols.length, 0);
  $('stats').innerHTML = `<b>${DATA.tables.length}</b> tablas · <b>${nCols}</b> columnas · <b>${DATA.fks.length}</b> llaves foráneas · <b>${DATA.views.length}</b> vistas · ${esc(DATA.source)}, extraído el ${fmtDate(DATA.extracted)}`;
  if (hubFks.length) {
    $('hubs-label').textContent = 'FK a ' + DATA.hubsLabel;
    $('hubs-n').textContent = `(${hubFks.length})`;
    $('hubs-wrap').title = DATA.hubs.join(', ');
  } else $('hubs-wrap').hidden = true;
  $('tables').innerHTML = DATA.tables.map(t => `<option value="${esc(t.n)}"></option>`).join('');
  if (DATA.tables.length) $('q').placeholder = 'Buscar tabla, p. ej. ' + DATA.tables[Math.min(3, DATA.tables.length - 1)].n;

  const modCount = {};
  for (const t of DATA.tables) modCount[t.m] = (modCount[t.m] || 0) + 1;
  const chips = $('chips');
  chips.innerHTML = `<button type="button" class="chip" data-m="" aria-pressed="true">Todos <span class="n">${DATA.tables.length}</span></button>` +
    (DATA.modules.length > 1 ? DATA.modules.map(m => `<button type="button" class="chip" data-m="${esc(m.id)}" aria-pressed="false" style="--mc:${modColor(m.id)}"><span class="dot"></span>${esc(m.name)} <span class="n">${modCount[m.id] || 0}</span></button>`).join('') : '');
  chips.addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) setFocus(b.dataset.m || null); });
  function setFocus(m) {
    state.focus = m;
    for (const b of chips.children) b.setAttribute('aria-pressed', String((b.dataset.m || null) === m));
    relayout({ fit: true });
  }
  for (const r of document.querySelectorAll('input[name="mode"]')) r.addEventListener('change', () => { state.mode = r.value; relayout({ keepView: true }); });
  $('hubs').addEventListener('change', e => { state.hubs = e.target.checked; relayout({ fit: true }); });
  $('panel-btn').addEventListener('click', () => panel.classList.toggle('open'));
  $('q').addEventListener('change', e => {
    const v = e.target.value.trim().toUpperCase(); if (!v) return;
    const names = DATA.tables.map(t => t.n);
    const hit = names.find(n => n.toUpperCase() === v) || names.find(n => n.toUpperCase().endsWith(v)) || names.find(n => n.toUpperCase().includes(v));
    if (hit) goTo(hit);
  });

  /* ---------- layout ---------- */
  const elk = typeof ELK !== 'undefined' ? new ELK() : null;
  let layoutSeq = 0;
  async function relayout(opt = {}) {
    if (!elk) { busy.innerHTML = '<div class="err">No se pudo cargar el motor de diagramas (elkjs). Revisa la conexión a internet y recarga, o genera el archivo con --inline-elk.</div>'; return; }
    const seq = ++layoutSeq;
    busy.hidden = false;
    const { graph, pairs, ghost, shown } = C.buildGraph(DATA, state, measure);
    let res;
    try { res = await elk.layout(graph); } catch (err) { busy.innerHTML = `<div class="err">No se pudo acomodar el diagrama: ${esc(err.message || err)}</div>`; return; }
    if (seq !== layoutSeq) return;
    Object.assign(state, { layout: C.extract(res), pairs, ghost, shown });
    if (state.sel && !shown.has(state.sel)) state.sel = null;
    render();
    if (opt.fit || !opt.keepView) fit(); else applyView();
    if (state.sel) select(state.sel, { center: !!opt.center }); else showOverview();
    busy.hidden = true;
  }

  /* ---------- render SVG ---------- */
  const pathD = pts => {
    const r = 6; let d = `M${pts[0][0]},${pts[0][1]}`;
    for (let i = 1; i < pts.length; i++) {
      const [x, y] = pts[i];
      if (i < pts.length - 1) {
        const [px, py] = pts[i - 1], [nx, ny] = pts[i + 1];
        const d1 = Math.hypot(x - px, y - py) || 1, d2 = Math.hypot(nx - x, ny - y) || 1, rr = Math.min(r, d1 / 2, d2 / 2);
        d += ` L${x - (x - px) / d1 * rr},${y - (y - py) / d1 * rr} Q${x},${y} ${x + (nx - x) / d2 * rr},${y + (ny - y) / d2 * rr}`;
      } else d += ` L${x},${y}`;
    }
    return d;
  };
  const fkLabel = f => `${f.n}\n${f.ch} (${f.chc.join(', ')})\n  → ${f.pa} (${f.pac.join(', ')})${f.del ? '\nON DELETE ' + f.del : ''}`;

  function render() {
    const L = state.layout; const out = [];
    for (const m of L.modules) {
      const ghost = m.id.startsWith('ghost:'); const mid = ghost ? m.id.slice(6) : m.id;
      const label = ghost ? `Relacionadas · ${MOD[mid].name}` : MOD[mid].name;
      out.push(`<g class="module${ghost ? ' ghost' : ''}" style="--mc:${modColor(mid)}"><rect class="module-box" x="${m.x}" y="${m.y}" width="${m.w}" height="${m.h}" rx="12"></rect>` +
        `<text class="module-label" x="${m.x + 18}" y="${m.y + 22}">${esc(label)}</text></g>`);
    }
    for (const [name, n] of Object.entries(L.nodes)) {
      const t = byName.get(name);
      const { rows, hidden } = C.visibleRows(t, state.mode);
      const x = n.x, y = n.y, w = n.w;
      let s = `<g class="tbl${state.ghost.has(name) ? ' ghost' : ''}" data-n="${esc(name)}" style="--mc:${modColor(t.m)}"><title>${esc(name + (t.cm ? '\n' + t.cm : ''))}</title>` +
        `<rect class="tbl-box" x="${x}" y="${y}" width="${w}" height="${n.h}" rx="6"></rect>` +
        `<path class="tbl-stripe" d="M${x},${y + 6} A6,6 0 0 1 ${x + 6},${y} H${x + w - 6} A6,6 0 0 1 ${x + w},${y + 6} Z"></path>` +
        `<text class="tbl-title" x="${x + G.padX}" y="${y + 24}">${esc(name)}</text>` +
        `<line class="tbl-sep" x1="${x}" x2="${x + w}" y1="${y + G.headerH}" y2="${y + G.headerH}"></line>`;
      rows.forEach((c, i) => {
        const ry = y + G.headerH + i * G.rowH, by = ry + 14.5;
        let badge = '', cls = '', tip = '';
        if (c.pk && c.fk) { badge = 'PF'; cls = 'pk'; } else if (c.pk) { badge = 'PK'; cls = 'pk'; } else if (c.fk) { badge = 'FK'; cls = 'fk'; } else if (c.uq) { badge = 'UQ'; cls = 'uq'; }
        if (c.fk && !state.hubs) {
          const refs = DATA.fks.filter(f => f.ch === name && f.chc.includes(c.n));
          if (refs.length && refs.every(f => HUBS.has(f.pa))) { if (!c.pk) cls = 'hub'; tip = `<title>${esc(c.n + ' → ' + [...new Set(refs.map(f => f.pa))].join(', ') + ' (relación oculta)')}</title>`; }
        }
        s += `<rect class="row-hl" data-k="${esc(name + '.' + c.n)}" x="${x + 1}" y="${ry + 1}" width="${w - 2}" height="${G.rowH - 1}"></rect>` +
          (badge ? `<text class="badge ${cls}" x="${x + G.padX}" y="${by}">${badge}${tip}</text>` : '') +
          `<text class="col-name" x="${x + G.padX + G.iconW}" y="${by}">${esc(c.n)}</text>` +
          `<text class="col-type" x="${x + w - G.padX}" y="${by}" text-anchor="end">${esc(c.t)}</text>`;
      });
      if (hidden) s += `<text class="col-more" x="${x + G.padX + G.iconW}" y="${y + G.headerH + rows.length * G.rowH + 14.5}">+ ${hidden} columna${hidden === 1 ? '' : 's'} más</text>`;
      out.push(s + '</g>');
    }
    for (const e of state.pairs.values()) {
      const pts = L.edges[e.id]; if (!pts || pts.length < 2) continue;
      const d = pathD(pts);
      out.push(`<g class="edge" data-pa="${esc(e.pa)}" data-ch="${esc(e.ch)}"><path class="edge-line" d="${d}"></path><path class="edge-hit" d="${d}"><title>${esc(e.fks.map(fkLabel).join('\n\n'))}</title></path></g>`);
    }
    world.innerHTML = out.join('');
  }

  /* ---------- selección y panel ---------- */
  const visibleFks = () => DATA.fks.filter(f => state.hubs || !HUBS.has(f.pa));
  function clearSel() {
    state.sel = null; world.classList.remove('has-sel');
    for (const el of world.querySelectorAll('.sel,.nb,.hi,.on')) el.classList.remove('sel', 'nb', 'hi', 'on');
  }
  function select(name, opt = {}) {
    clearSel(); state.sel = name; world.classList.add('has-sel');
    const nb = new Set([name]);
    for (const el of world.querySelectorAll('.edge')) if (el.dataset.pa === name || el.dataset.ch === name) { el.classList.add('hi'); nb.add(el.dataset.pa); nb.add(el.dataset.ch); }
    for (const el of world.querySelectorAll('.tbl')) { if (el.dataset.n === name) el.classList.add('sel'); else if (nb.has(el.dataset.n)) el.classList.add('nb'); }
    const keys = new Set();
    for (const f of visibleFks()) if (f.ch === name || f.pa === name) { f.chc.forEach(c => keys.add(f.ch + '.' + c)); f.pac.forEach(c => keys.add(f.pa + '.' + c)); }
    for (const el of world.querySelectorAll('.row-hl')) if (keys.has(el.dataset.k)) el.classList.add('on');
    showTable(name);
    if (opt.center) centerOn(name);
  }
  function goTo(name) {
    $('q').value = '';
    if (state.shown && state.shown.has(name)) { select(name, { center: true }); return; }
    state.sel = name; state.focus = null;
    for (const b of chips.children) b.setAttribute('aria-pressed', String(!b.dataset.m));
    relayout({ keepView: true, center: true });
  }
  const linkItem = (target, sub, off) =>
    `<li><button type="button" data-go="${esc(target)}"><span class="t">${esc(target)}</span><span class="s">${esc(sub)}</span>${off ? `<span class="off">${off}</span>` : ''}</button></li>`;

  function showTable(name) {
    const t = byName.get(name);
    const pk = t.cols.filter(c => c.pk).map(c => c.n);
    const out = DATA.fks.filter(f => f.ch === name), inc = DATA.fks.filter(f => f.pa === name);
    const hiddenTag = f => !state.hubs && HUBS.has(f.pa) ? 'Oculta en el diagrama' : '';
    const colsHtml = t.cols.map(c => {
      const b = c.pk && c.fk ? 'PF' : c.pk ? 'PK' : c.fk ? 'FK' : c.uq ? 'UQ' : '';
      return `<li><span class="b${c.pk ? ' pk' : ''}">${b}</span><span class="nm">${esc(c.n)}${c.nn && !c.pk ? '<span class="nn">NOT NULL</span>' : ''}</span><span class="ty">${esc(c.t)}</span>${c.cm ? `<span class="cm">${esc(c.cm)}</span>` : ''}</li>`;
    }).join('');
    const incByChild = new Map();
    for (const f of inc) { if (!incByChild.has(f.ch)) incByChild.set(f.ch, []); incByChild.get(f.ch).push(f); }
    panel.innerHTML =
      `<button type="button" class="close" id="pclose">Cerrar</button>` +
      `<div class="mod-tag" style="--mc:${modColor(t.m)}">${esc(MOD[t.m].name)}</div>` +
      `<h2>${esc(name)}</h2>` +
      `<p class="lead">${t.cm ? esc(t.cm) : 'Sin comentario en la base de datos.'}</p>` +
      `<p class="meta">${t.cols.length} columnas · PK (${esc(pk.join(', ') || '—')}) · ${out.length} FK salientes · ${inc.length} entrantes &nbsp;<button type="button" class="copy" id="pcopy">Copiar nombre</button></p>` +
      (out.length ? `<h3>Referencia a</h3><ul class="links">${out.map(f => linkItem(f.pa, `(${f.chc.join(', ')}) → (${f.pac.join(', ')})`, hiddenTag(f))).join('')}</ul>` : '') +
      (inc.length ? `<h3>Referenciada por</h3><ul class="links">${[...incByChild].map(([ch, fs]) => linkItem(ch, fs.map(f => `(${f.chc.join(', ')})`).join(' · '), '')).join('')}</ul>` : '') +
      (!out.length && !inc.length ? `<h3>Relaciones</h3><p class="lead">Esta tabla no tiene llaves foráneas declaradas ni otras tablas la referencian.</p>` : '') +
      `<h3>Columnas</h3><ul class="cols">${colsHtml}</ul>`;
    $('pclose').addEventListener('click', () => { clearSel(); showOverview(); panel.classList.remove('open'); });
    $('pcopy').addEventListener('click', ev => {
      const btn = ev.currentTarget;
      try { navigator.clipboard.writeText(name).then(() => { btn.textContent = 'Copiado'; }, () => { btn.textContent = name; }); } catch { btn.textContent = name; }
    });
    if (matchMedia('(max-width: 860px)').matches) panel.classList.add('open');
    panel.scrollTop = 0;
  }

  function showOverview() {
    const isolated = DATA.tables.filter(t => !DATA.fks.some(f => f.ch === t.n || f.pa === t.n)).map(t => t.n);
    const lg = (inner, text) => `<div><svg viewBox="0 0 46 18" aria-hidden="true">${inner}</svg><span>${text}</span></div>`;
    panel.innerHTML =
      `<h3 style="margin-top:0">Cómo leer el diagrama</h3><div class="legend">` +
      lg(`<text x="2" y="13" class="badge pk" style="font-size:11px">PK</text>`, 'Columna de la llave primaria') +
      lg(`<text x="2" y="13" class="badge fk" style="font-size:11px">FK</text>`, 'Columna de una llave foránea') +
      lg(`<text x="2" y="13" class="badge pk" style="font-size:11px">PF</text>`, 'Es parte de la PK y también de una FK') +
      lg(`<path class="mk" d="M0 9 H46 M6 4 V14 M10 4 V14"></path>`, 'Lado de la tabla referenciada (uno)') +
      lg(`<path class="mk" d="M0 9 H46 M32 9 L46 3 M32 9 L46 9 M32 9 L46 15 M34 4 V14"></path>`, 'Lado de la tabla que guarda la FK (muchos)') +
      `</div>` +
      `<p class="lead" style="margin-top:12px">Haz clic en una tabla para ver sus columnas y relaciones. Arrastra para moverte y usa la rueda o pellizca para hacer zoom. Pasa el cursor por una línea para ver la FK.</p>` +
      (hubFks.length ? `<p class="lead">${hubFks.length} de las ${DATA.fks.length} FK apuntan a ${esc(DATA.hubs.join(', '))}. Están ocultas por defecto para que el diagrama se lea; actívalas con el interruptor.</p>` : '') +
      (DATA.modules.length > 1 ? `<h3>Módulos</h3><ul class="mods">${DATA.modules.map(m => `<li><button type="button" data-mod="${esc(m.id)}" style="--mc:${modColor(m.id)}"><span class="dot"></span><span>${esc(m.name)}</span><span class="n">${modCount[m.id] || 0}</span></button></li>`).join('')}</ul>` : '') +
      (isolated.length ? `<h3>Tablas sin relaciones declaradas (${isolated.length})</h3><ul class="plain">${isolated.map(n => `<li>${esc(n)}</li>`).join('')}</ul>` : '') +
      (DATA.views.length ? `<h3>Vistas (no se dibujan)</h3><ul class="plain">${DATA.views.map(n => `<li>${esc(n)}</li>`).join('')}</ul>` : '');
  }
  panel.addEventListener('click', e => {
    const go = e.target.closest('[data-go]'); if (go) { goTo(go.dataset.go); return; }
    const md = e.target.closest('[data-mod]'); if (md) setFocus(md.dataset.mod);
  });

  /* ---------- pan y zoom ---------- */
  const V = state.view;
  function applyView() {
    world.setAttribute('transform', `translate(${V.x},${V.y}) scale(${V.k})`);
    world.style.setProperty('--ml', Math.min(64, Math.max(12, 13 / V.k)) + 'px');
    $('zlevel').textContent = Math.round(V.k * 100) + '%';
  }
  function fit() {
    const L = state.layout; if (!L) return;
    const r = canvas.getBoundingClientRect();
    V.k = Math.min(r.width / L.width, r.height / L.height, 1.2) * 0.96;
    V.x = (r.width - L.width * V.k) / 2; V.y = (r.height - L.height * V.k) / 2;
    applyView();
  }
  function zoomAt(px, py, f) {
    const k = Math.min(3, Math.max(0.05, V.k * f)); f = k / V.k;
    V.x = px - (px - V.x) * f; V.y = py - (py - V.y) * f; V.k = k; applyView();
  }
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function centerOn(name) {
    const n = state.layout && state.layout.nodes[name]; if (!n) return;
    const r = canvas.getBoundingClientRect();
    const k = Math.max(V.k, Math.min(1, r.width / (n.w * 2.2)));
    const target = { k, x: r.width / 2 - (n.x + n.w / 2) * k, y: r.height / 2 - (n.y + Math.min(n.h, r.height / k * 0.8) / 2) * k };
    if (reduce) { Object.assign(V, target); applyView(); return; }
    const from = { ...V }, t0 = performance.now();
    const step = now => {
      const p = Math.min(1, (now - t0) / 320), e = 1 - Math.pow(1 - p, 3);
      V.k = from.k + (target.k - from.k) * e; V.x = from.x + (target.x - from.x) * e; V.y = from.y + (target.y - from.y) * e;
      applyView(); if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }
  $('zin').addEventListener('click', () => { const r = canvas.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, 1.25); });
  $('zout').addEventListener('click', () => { const r = canvas.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, 0.8); });
  $('zfit').addEventListener('click', fit);
  svg.addEventListener('wheel', e => {
    e.preventDefault();
    const r = canvas.getBoundingClientRect();
    zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * (e.deltaMode === 1 ? 0.05 : 0.0018)));
  }, { passive: false });
  const ptrs = new Map(); let downAt = null, moved = 0, pinch = null;
  svg.addEventListener('pointerdown', e => {
    svg.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 1) { downAt = { target: e.target }; moved = 0; canvas.classList.add('dragging'); }
    if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) }; moved = 99; }
  });
  svg.addEventListener('pointermove', e => {
    const p = ptrs.get(e.pointerId); if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
    if (ptrs.size === 1) { V.x += dx; V.y += dy; moved += Math.abs(dx) + Math.abs(dy); applyView(); }
    else if (ptrs.size === 2 && pinch) {
      const [a, b] = [...ptrs.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y), r = canvas.getBoundingClientRect();
      zoomAt((a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top, d / pinch.d); pinch.d = d;
    }
  });
  const endPtr = e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.delete(e.pointerId);
    if (ptrs.size < 2) pinch = null;
    if (ptrs.size === 0) {
      canvas.classList.remove('dragging');
      if (downAt && moved < 5 && e.type === 'pointerup') {
        const tbl = downAt.target.closest && downAt.target.closest('.tbl');
        if (tbl) select(tbl.dataset.n); else if (!downAt.target.closest('.edge')) { clearSel(); showOverview(); }
      }
      downAt = null;
    }
  };
  svg.addEventListener('pointerup', endPtr);
  svg.addEventListener('pointercancel', endPtr);
  window.addEventListener('resize', () => { if (state.layout && !state.sel) fit(); });

  /* ---------- arranque: medir con las fuentes reales, no con las de respaldo ---------- */
  showOverview();
  const fontsReady = document.fonts && document.fonts.load
    ? Promise.all(Object.values(FONTS).map(f => document.fonts.load(f))).catch(() => {})
    : Promise.resolve();
  Promise.race([fontsReady, new Promise(r => setTimeout(r, 2500))]).then(() => relayout({ fit: true }));
})();
</script>
